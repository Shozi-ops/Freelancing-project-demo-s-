<script>
'use strict';
const $=s=>document.querySelector(s),escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),KEY='atds-client-journey-v1';
const LOGO='assets/atds-logo.png';
const initialCompany={name:'Architectural Tech & Digital Solutions',email:'swshozi@icloud.com',phone:'079 101 7885 / 081 398 7372',location:'Margate, KwaZulu-Natal',banks:[{id:'fnb',name:'FNB (Easy Account)',account:'63150296234',payshap:'0791017885@fnb'},{id:'tyme',name:'TymeBank (Current)',account:'510 6903 5798',payshap:'0813987372@tymebank'}]};
const initialCatalog=[{id:'website',name:'Website Design & Custom Development',description:'Full-stack website development, mobile-responsive interface, WhatsApp integration, call actions and local SEO setup.',rate:200000,unit:'once-off',category:'service'},{id:'maintenance',name:'Ad-Hoc Maintenance & Updates',description:'Minor updates, photo additions and content changes. R200–R500 per job, depending on the agreed scope.',rate:20000,unit:'per job',category:'service'},{id:'monthly',name:'Monthly Hosting',description:'Managed hosting, SSL security, DNS routing and edge distribution. First month included in this invoice.',rate:15000,unit:'per month',category:'hosting'},{id:'annual',name:'Annual Hosting',description:'Managed hosting and server maintenance, billed annually. First year included in this invoice.',rate:100000,unit:'per year',category:'hosting'},{id:'lifetime',name:'Lifetime Hosting',description:'Once-off hosting and managed server deployment. Future site modifications and content updates are billed separately.',rate:250000,unit:'once-off',category:'hosting'}];
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDate(date,n,monthly=false){const d=new Date(date+'T12:00:00');if(monthly){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}else d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function money(c){return 'R'+(c/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\u00a0/g,' ')}
let data={version:1,company:structuredClone(initialCompany),catalog:structuredClone(initialCatalog),invoices:[],draft:null},step=1,loadedSnapshot=false;
function makeDraft(){let n=data.invoices.length+1;while(data.invoices.some(i=>i.number===`ATDS-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`))n++;return{id:crypto.randomUUID(),number:`ATDS-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`,client:'',email:'',phone:'',address:'',issue:today(),start:today(),due:addDate(today(),14),plan:null,deposit:25,count:3,bank:'fnb',tax:0,discount:0,notes:'Please use the invoice number as your payment reference and email proof of payment. Thank you for your business.',items:[],payments:[]}}
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T12:00:00'))&&addDate(v,0)===v}
function validateCompany(c){if(!c||['name','email','phone','location'].some(k=>typeof c[k]!=='string')||!Array.isArray(c.banks)||!c.banks.length)throw Error('Invalid company information');for(const b of c.banks)if(['id','name','account','payshap'].some(k=>typeof b[k]!=='string'))throw Error('Invalid bank details')}
function validateDraft(d){if(!d||['id','number','client','email','phone','address','notes','bank'].some(k=>typeof d[k]!=='string')||!['issue','start','due'].every(k=>validDate(d[k]))||![null,'full','split','weekly','monthly','custom'].includes(d.plan))throw Error('Invalid invoice details');if(!Array.isArray(d.items)||!Array.isArray(d.payments)||d.items.length>500)throw Error('Invalid invoice items');for(const i of d.items){if(['id','name','unit','category','description'].some(k=>typeof i[k]!=='string')||!Number.isSafeInteger(i.rate)||i.rate<0||i.rate>1e11||!Number.isInteger(i.qty)||i.qty<1||i.qty>10000)throw Error('Invalid invoice item')}for(const k of ['tax','discount','deposit'])if(!Number.isFinite(d[k])||d[k]<0||d[k]>100)throw Error('Invalid percentage');if(!Number.isInteger(d.count)||d.count<1||d.count>60)throw Error('Invalid installment count');for(const p of d.payments)if(!Number.isSafeInteger(p.amount)||p.amount<=0||typeof p.note!=='string'||!validDate(p.date))throw Error('Invalid payment');if(d.company)validateCompany(d.company);if(!Number.isSafeInteger(totals(d).total))throw Error('Invoice is too large')}
function validateData(s){if(!s||s.version!==1||!Array.isArray(s.catalog)||!Array.isArray(s.invoices)||s.invoices.length>10000)throw Error('Not a valid ATDS backup');validateCompany(s.company);for(const c of s.catalog)if(['id','name','description','unit','category'].some(k=>typeof c[k]!=='string')||!Number.isSafeInteger(c.rate)||c.rate<0)throw Error('Invalid price list');s.invoices.forEach(validateDraft);if(s.draft)validateDraft(s.draft)}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);validateData(saved);data=saved}}catch{setTimeout(()=>toast('Saved data could not be loaded. This session starts with company defaults.'),100)}
let draft=data.draft||makeDraft();loadedSnapshot=!!draft.company;
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
function persist(){try{validateDraft(draft);data.draft=structuredClone(draft)}catch{}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('Browser storage is unavailable. Export a backup before closing.');return false}}
function company(){return draft.company||data.company}
function totals(d=draft){const subtotal=d.items.reduce((sum,i)=>sum+i.rate*i.qty,0),discount=Math.round(subtotal*d.discount/100),tax=Math.round((subtotal-discount)*d.tax/100),total=subtotal-discount+tax,paid=d.payments.reduce((sum,p)=>sum+p.amount,0);return{subtotal,discount,tax,total,paid,balance:total-paid}}
function split(total,count){const base=Math.floor(total/count);return Array.from({length:count},(_,i)=>base+(i<total%count?1:0))}
function planName(p){return({full:'Pay in full',split:'50 / 50 split',weekly:'4 weekly payments',monthly:'3 monthly payments',custom:'Deposit + monthly installments'})[p]||'Choose a plan'}
function schedule(d=draft,plan=d.plan){const total=totals(d).total;let parts,monthly=false,interval=7;if(plan==='split'){const deposit=Math.round(total/2);parts=[deposit,total-deposit]}else if(plan==='weekly')parts=split(total,4);else if(plan==='monthly'){parts=split(total,3);monthly=true;interval=1}else if(plan==='custom'){const deposit=Math.round(total*d.deposit/100);parts=[deposit,...split(total-deposit,d.count)];monthly=true;interval=1}else parts=[total];return parts.map((amount,i)=>({amount,label:plan==='custom'&&i===0?'Deposit':plan==='split'?(i===0?'Deposit':'Final payment'):`Payment ${i+1}`,date:plan==='split'&&i===1?d.due:addDate(d.start,i*interval,monthly)}))}
const field=(label,name,value,type='text',attrs='')=>`<label>${label}<input name="${name}" id="${name}" value="${escapeHTML(value)}" type="${type}" ${attrs}></label>`;
function refreshBrand(){const c=company();$('#contact').innerHTML=`<a href="mailto:${escapeHTML(c.email)}">${escapeHTML(c.email)}</a><br>${escapeHTML(c.phone)}<br>${escapeHTML(c.location)}`;$('#footer').textContent=c.name+' · '+c.location+' · '+c.email;document.querySelectorAll('.logo').forEach(el=>el.src=LOGO)}
function go(n){if(n>1&&!draft.items.length){toast('Choose at least one product or service first.');return}if(n===3&&!draft.plan){toast('Choose a payment option to create your invoice.');n=2}if(step===2&&$('#paymentForm')&&!$('#paymentForm').reportValidity())return;step=n;history.replaceState(null,'','#'+['','price-list','payment-options','invoice'][n]);render();window.scrollTo({top:0,behavior:'instant'})}
function render(){refreshBrand();document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-current',+b.dataset.step===step?'page':'false'));({1:renderPrices,2:renderPayments,3:renderInvoice})[step]();persist()}
function intro(number,title,description,buttons=''){return `<div class="intro"><div><span class="eyebrow">${number} / 03</span><h1>${title}</h1><p>${description}</p></div><div class="actions">${buttons}</div></div>`}
function summary(){const t=totals();return `<h3>Your selection</h3>${draft.items.length?draft.items.map(i=>`<div class="summary-row"><span>${escapeHTML(i.name)}${i.qty>1?' × '+i.qty:''}<br><span class="muted small">${escapeHTML(i.unit)}</span></span><strong>${money(i.rate*i.qty)}</strong></div>`).join(''):'<p class="note">Choose the services you need to build your quote.</p>'}${t.discount?`<div class="summary-row"><span>Discount (${draft.discount}%)</span><strong>−${money(t.discount)}</strong></div>`:''}${t.tax?`<div class="summary-row"><span>Tax (${draft.tax}%)</span><strong>${money(t.tax)}</strong></div>`:''}<div class="grand"><span>Invoice total</span><span>${money(t.total)}</span></div>${recurringText()?`<div class="callout">${recurringText()}</div>`:''}`}
function recurringText(){const r=draft.items.find(i=>i.id==='monthly'||i.id==='annual');return r?`${money(r.rate)} ${r.unit} hosting. This invoice includes the first ${r.id==='monthly'?'month':'year'} only. Later renewals are billed separately; automatic billing is not enabled.`:''}
function toggleItem(id){const c=data.catalog.find(i=>i.id===id),existing=draft.items.find(i=>i.id===id);if(existing)draft.items=draft.items.filter(i=>i.id!==id);else{if(c.category==='hosting')draft.items=draft.items.filter(i=>i.category!=='hosting');draft.items.push({...structuredClone(c),qty:1})}render()}
function renderPrices(){const services=data.catalog.filter(c=>c.category!=='hosting'),hosting=data.catalog.filter(c=>c.category==='hosting');$('#page').innerHTML=intro('01','Build your digital foundation.','Select your services and a hosting package. Your selection carries through to payment options and your invoice.',`<button id="editPrices">Manage prices</button>`)+`<div class="layout"><div><div class="card"><h2>Design, development & support</h2><p class="note">Once-off project work and updates, priced in South African rand.</p>${services.map(c=>{const selected=draft.items.find(i=>i.id===c.id);return `<article class="service ${selected?'selected':''}"><div><span class="pill">${escapeHTML(c.unit)}</span><h3>${escapeHTML(c.name)}</h3><p>${escapeHTML(c.description)}</p>${selected?`<div class="quantity"><label for="qty-${escapeHTML(c.id)}">Quantity</label><input id="qty-${escapeHTML(c.id)}" aria-label="${escapeHTML(c.name)} quantity" type="number" min="1" max="10000" step="1" value="${selected.qty}" data-quantity="${escapeHTML(c.id)}"></div>`:''}</div><div class="service-side"><div class="price">${money(c.rate)}${c.id==='maintenance'?'<div class="unit">Starting price · scope dependent</div>':''}</div><button data-toggle="${escapeHTML(c.id)}" class="${selected?'':'primary'}" aria-pressed="${!!selected}">${selected?'Remove':'Add service'}</button></div></article>`}).join('')}</div><div class="card"><h2>Hosting & infrastructure</h2><p class="note">Choose one package, or continue without hosting.</p><div class="hosting">${hosting.map(c=>{const selected=draft.items.some(i=>i.id===c.id);return `<article class="host ${selected?'selected':''}"><div><h3>${escapeHTML(c.name)}</h3><div class="price">${money(c.rate)}</div><span class="unit">${escapeHTML(c.unit)}</span></div><p>${escapeHTML(c.description)}</p><button data-toggle="${escapeHTML(c.id)}" aria-pressed="${selected}" class="${selected?'':'primary'}">${selected?'Remove package':'Select package'}</button></article>`}).join('')}</div></div><p class="note">Hosting covers hosting and server maintenance. Future site modifications, photo additions and content updates are quoted separately. No client-specific promotional discount is included.</p></div><aside class="card aside-card"><div id="selectionSummary">${summary()}</div><button class="primary full" id="continue" ${!draft.items.length?'disabled':''}>Continue to payment options →</button><p class="note" style="margin-top:16px;margin-bottom:0">Next: choose a payment schedule and bank. No payment is taken here.</p></aside></div>`;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleItem(b.dataset.toggle));document.querySelectorAll('[data-quantity]').forEach(el=>el.onchange=()=>{const v=Number(el.value);if(!el.checkValidity()||!Number.isInteger(v)){el.reportValidity();el.value=draft.items.find(i=>i.id===el.dataset.quantity).qty;return}draft.items.find(i=>i.id===el.dataset.quantity).qty=v;persist();$('#selectionSummary').innerHTML=summary()});$('#continue').onclick=()=>go(2);$('#editPrices').onclick=editPrices}
function renderPayments(){$('#page').innerHTML=intro('02','Choose how you would like to pay.','Choose a bank below, then select a payment plan to go straight to your invoice.',`<button id="backPrices">← Price list</button>`)+`<div class="layout"><div><form class="card" id="paymentForm"><h2>Payment details</h2><div class="fields"><label>Pay into<select id="bank" name="bank">${company().banks.map(b=>`<option value="${escapeHTML(b.id)}" ${draft.bank===b.id?'selected':''}>${escapeHTML(b.name)}</option>`).join('')}</select></label>${field('First payment date','start',draft.start,'date','required')}${field('Final date for 50 / 50 split','due',draft.due,'date','required')}</div><p class="note" style="margin-top:14px;margin-bottom:0">Bank transfer or PayShap. Bank details and the invoice reference appear on your invoice.</p></form><div class="plan-grid">${['full','split','weekly','monthly'].map(p=>{const amounts=schedule(draft,p);return `<article class="plan-card ${draft.plan===p?'active':''}"><span class="eyebrow">${p==='full'?'One payment':'Interest-free schedule'}</span><h3 style="margin-top:12px">${planName(p)}</h3><div class="plan-amount">${p==='full'?money(totals().total):amounts.length+' payments'}</div><p>${p==='full'?'Pay the full invoice amount on your selected date.':p==='split'?'50% deposit on the first payment date; the remainder on your final date.':p==='weekly'?'Four payments, seven days apart.':'Three payments, one month apart.'}<br><strong>First payment: ${money(amounts[0].amount)}</strong></p><button class="primary" data-select-plan="${p}">Select & view invoice →</button></article>`}).join('')}<article class="plan-card wide"><span class="eyebrow">Flexible schedule</span><h3 style="margin-top:12px">Deposit + monthly installments</h3><p>Set a deposit, then divide the remaining amount across monthly payments.</p><form id="customForm" class="fields">${field('Deposit (%)','deposit',draft.deposit,'number','required min="0" max="100" step="0.01"')}${field('Installments after deposit','count',draft.count,'number','required min="1" max="60" step="1"')}</form><button style="margin-top:18px" class="primary" data-select-plan="custom">Select custom plan & view invoice →</button></article></div></div><aside class="card aside-card">${summary()}<div class="callout">Selecting a plan prepares an invoice. It does not transfer money or set up a debit order.</div></aside></div>`;$('#backPrices').onclick=()=>go(1);$('#paymentForm').onchange=e=>{draft[e.target.name]=e.target.value;persist()};document.querySelectorAll('[data-select-plan]').forEach(b=>b.onclick=()=>{if(!$('#paymentForm').reportValidity())return;const plan=b.dataset.selectPlan;if(plan==='split'&&draft.due<draft.start){toast('The final payment date must be on or after the first payment date.');return}if(plan==='custom'){if(!$('#customForm').reportValidity())return;draft.deposit=Number($('#deposit').value);draft.count=Number($('#count').value)}draft.plan=plan;go(3)})}
function renderInvoice(){const t=totals();$('#page').innerHTML=intro('03','Your invoice, ready to personalise.','Add the client’s details, review the selected services, then save or download your invoice. Send the PDF to the company to confirm your order.',`<button id="backPayments">← Payment options</button><button id="saveInvoice">Save invoice</button><button id="printInvoice" class="primary">Print / Save PDF</button>`)+`<div class="invoice-layout"><div><form id="invoiceForm" class="card invoice-editor"><h2>Client details</h2>${field('Client / company name','client',draft.client,'text','required maxlength="200" placeholder="Enter client name"')}${field('Email','email',draft.email,'email','placeholder="Client email (optional)"')}${field('Phone','phone',draft.phone,'text','placeholder="Client phone (optional)"')}<label>Address<textarea id="address" name="address" placeholder="Client address (optional)">${escapeHTML(draft.address)}</textarea></label><h3 class="divider">Invoice details</h3>${field('Invoice number','number',draft.number,'text','required maxlength="80"')}${field('Issue date','issue',draft.issue,'date','required')}<div class="fields">${field('Discount (%)','discount',draft.discount,'number','required min="0" max="100" step="0.01"')}${field('Tax (%)','tax',draft.tax,'number','required min="0" max="100" step="0.01"')}</div><p class="note" style="margin-top:14px">No tax is added by default. Enter a rate only when applicable to this invoice.</p><label>Notes & agreed terms<textarea id="notes" name="notes">${escapeHTML(draft.notes)}</textarea></label><h3 class="divider">${planName(draft.plan)}</h3><p class="note">${schedule().length} scheduled payment${schedule().length===1?'':'s'} · First payment ${money(schedule()[0].amount)}</p></form><div class="card"><h3>Payments recorded</h3><div class="grand"><span>Balance</span><span id="balance">${money(t.balance)}</span></div>${draft.payments.map((p,i)=>`<div class="summary-row"><span>${escapeHTML(p.date)}<br>${escapeHTML(p.note)}</span><strong>${money(p.amount)}<br><button class="text-btn danger" type="button" data-remove-payment="${i}">Remove</button></strong></div>`).join('')}<button class="full" id="recordPayment">Record received payment</button><p class="note" style="margin:14px 0 0">For payments already received. This does not charge the client.</p></div></div><div id="invoicePreview">${invoiceHTML()}</div></div>`;$('#invoiceForm').oninput=e=>{const k=e.target.name;if(!k)return;draft[k]=['discount','tax'].includes(k)?Number(e.target.value):e.target.value;persist();$('#invoicePreview').innerHTML=invoiceHTML();$('#balance').textContent=money(totals().balance)};$('#backPayments').onclick=()=>go(2);$('#saveInvoice').onclick=saveInvoice;$('#printInvoice').onclick=()=>{if(!validInvoice())return;$('#printArea').innerHTML=invoiceHTML();window.print()};$('#recordPayment').onclick=recordPayment;document.querySelectorAll('[data-remove-payment]').forEach(b=>b.onclick=()=>{if(confirm('Remove this payment record? This does not refund money.')){draft.payments.splice(+b.dataset.removePayment,1);render()}})}
function invoiceHTML(){const c=company(),t=totals(),bank=c.banks.find(b=>b.id===draft.bank)||c.banks[0],dates=schedule();return `<article class="paper"><div class="paper-head"><img class="paper-logo" src="${LOGO}" alt="Architectural Tech & Digital Solutions"><div class="invoice-title"><h2>INVOICE</h2><strong class="small">${escapeHTML(draft.number)}</strong><div class="small muted">Issued ${escapeHTML(draft.issue)}</div><span class="badge">${t.total>0&&t.balance===0?'Paid':t.paid?'Part paid':'Awaiting payment'}</span></div></div><div class="parties"><div><span class="eyebrow">Billed from</span><br><strong>${escapeHTML(c.name)}</strong><br>${escapeHTML(c.location)}<br>${escapeHTML(c.email)}<br>${escapeHTML(c.phone)}</div><div><span class="eyebrow">Billed to</span><br><strong>${escapeHTML(draft.client||'Client details to be completed')}</strong><br><span class="preserve">${escapeHTML(draft.address)}</span>${draft.email?'<br>'+escapeHTML(draft.email):''}${draft.phone?'<br>'+escapeHTML(draft.phone):''}</div></div><table><thead><tr><th>Service / item</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Amount</th></tr></thead><tbody>${draft.items.map(i=>`<tr><td><strong>${escapeHTML(i.name)}</strong><br><span class="muted small">${escapeHTML(i.unit)}</span></td><td class="right">${i.qty}</td><td class="right">${money(i.rate)}</td><td class="right">${money(i.rate*i.qty)}</td></tr>`).join('')}</tbody></table><div class="paper-totals"><div class="summary-row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div><div class="summary-row"><span>Discount (${draft.discount}%)</span><strong>−${money(t.discount)}</strong></div><div class="summary-row"><span>Tax (${draft.tax}%)</span><strong>${money(t.tax)}</strong></div><div class="grand"><span>Total</span><span>${money(t.total)}</span></div>${t.paid?`<div class="summary-row"><span>Payments received</span><strong>${money(t.paid)}</strong></div><div class="summary-row"><strong>Balance due</strong><strong>${money(t.balance)}</strong></div>`:''}</div><h3>Payment schedule · ${planName(draft.plan)}</h3><div class="schedule">${dates.map(p=>`<div class="summary-row"><span>${p.label} · ${escapeHTML(p.date)}</span><strong>${money(p.amount)}</strong></div>`).join('')}</div>${t.paid?'<p class="note">The schedule shows the original agreed amounts. Payments received reduce the balance due above.</p>':''}${recurringText()?`<p class="note">${recurringText()}</p>`:''}<div class="payment-instructions"><h3>Bank transfer / PayShap</h3><div class="note"><strong>${escapeHTML(bank.name)}</strong><br>Account holder: ${escapeHTML(c.name)}<br>Account number: <strong>${escapeHTML(bank.account)}</strong><br>PayShap: <strong>${escapeHTML(bank.payshap)}</strong><br>Payment reference: <strong>${escapeHTML(draft.number)}</strong><br>Proof of payment: ${escapeHTML(c.email)}</div></div><h3 style="margin-top:20px">Notes & agreed terms</h3><div class="note preserve">${escapeHTML(draft.notes)}</div><div class="paper-foot"><span>${escapeHTML(c.name)}</span><span>Thank you for your business.</span></div></article>`}
function validInvoice(){if($('#invoiceForm')&&!$('#invoiceForm').reportValidity())return false;try{validateDraft(draft);if(!draft.client.trim()||!draft.number.trim())throw Error('Enter a client name and invoice number.');if(!draft.plan||!draft.items.length)throw Error('Choose services and a payment plan first.');if(draft.plan==='split'&&draft.due<draft.start)throw Error('The final payment date must follow the deposit date.');if(totals().balance<0)throw Error('The total cannot be less than payments already received.');if(data.invoices.some(i=>i.id!==draft.id&&i.number===draft.number))throw Error('This invoice number is already in use.');return true}catch(e){toast(e.message);return false}}
function saveInvoice(){if(!validInvoice())return;draft.company=structuredClone(company());const index=data.invoices.findIndex(i=>i.id===draft.id);if(index===-1)data.invoices.unshift(structuredClone(draft));else data.invoices[index]=structuredClone(draft);if(persist())toast('Invoice saved on this device.');}
function showDialog(html,bind){$('#dialogBody').innerHTML=html+`<div class="actions end"><button id="closeDialog" type="button">Close</button></div>`;$('#closeDialog').onclick=()=>$('#dialog').close();if(bind)bind();$('#dialog').showModal()}
function recordPayment(){if(!validInvoice())return;const balance=totals().balance;if(balance<=0){toast('There is no outstanding balance.');return}showDialog(`<h2>Record received payment</h2><form id="recordForm"><div class="fields">${field('Amount received (ZAR)','received',(balance/100).toFixed(2),'number',`required min="0.01" max="${balance/100}" step="0.01"`)}${field('Date received','receivedDate',today(),'date','required')}${field('Reference / note','receivedNote','','text','maxlength="250"')}</div><button class="primary" style="margin-top:20px">Record payment</button></form>`,()=>{$('#recordForm').onsubmit=e=>{e.preventDefault();draft.payments.push({amount:Math.round(Number($('#received').value)*100),date:$('#receivedDate').value,note:$('#receivedNote').value});$('#dialog').close();saveInvoice();render()}})}
function editPrices(){showDialog(`<h2>Manage company prices</h2><p class="note">Changes update this price list and any selected items in the current draft. Previously saved invoices keep their prices.</p><form id="pricesForm">${data.catalog.map(c=>`<label style="margin:14px 0">${escapeHTML(c.name)} (ZAR)<input type="number" name="${escapeHTML(c.id)}" value="${(c.rate/100).toFixed(2)}" min="0" max="1000000000" step="0.01" required></label>`).join('')}<button class="primary">Save prices</button></form>`,()=>{$('#pricesForm').onsubmit=e=>{e.preventDefault();const updates=data.catalog.map(c=>({...c,rate:Math.round(Number(e.target.elements[c.id].value)*100)}));const updatedItems=draft.items.map(i=>({...i,rate:updates.find(c=>c.id===i.id)?.rate??i.rate}));if(totals({...draft,items:updatedItems}).balance<0){toast('These prices would reduce the invoice below payments received.');return}data.catalog=updates;draft.items=updatedItems;$('#dialog').close();render();toast('Prices updated.')}})}
function savedInvoices(){showDialog(`<h2>Saved invoices</h2><p class="note">Saved only in this browser. Export a backup to keep a separate copy.</p>${data.invoices.length?data.invoices.map(i=>`<div class="history-row"><div><strong>${escapeHTML(i.number)}</strong><br>${escapeHTML(i.client)}<br><span class="muted small">${money(totals(i).total)} · ${planName(i.plan)}</span></div><div class="actions"><button data-open="${escapeHTML(i.id)}">Open</button><button class="danger" data-delete="${escapeHTML(i.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No invoices saved yet.</div>'}`,()=>{document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(draft.items.length&&!confirm('Open this saved invoice and replace the current working draft?'))return;draft=structuredClone(data.invoices.find(i=>i.id===b.dataset.open));loadedSnapshot=true;$('#dialog').close();go(3)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this saved invoice?')){data.invoices=data.invoices.filter(i=>i.id!==b.dataset.delete);persist();$('#dialog').close();savedInvoices()}})})}
function editCompany(){const c=data.company;showDialog(`<h2>Company details</h2><p class="note">These details are used on new invoices. Saved invoices retain their company and bank details.</p><form id="companyForm"><div class="fields">${field('Company name','companyName',c.name,'text','required')}${field('Email','companyEmail',c.email,'email','required')}${field('Phone / WhatsApp','companyPhone',c.phone,'text','required')}${field('Location','companyLocation',c.location,'text','required')}</div>${c.banks.map((b,i)=>`<h3 class="divider">${escapeHTML(b.name)}</h3><div class="fields">${field('Account number','account'+i,b.account,'text','required')}${field('PayShap ID','payshap'+i,b.payshap,'text','required')}</div>`).join('')}<button class="primary" style="margin-top:22px">Save company details</button></form>`,()=>{$('#companyForm').onsubmit=e=>{e.preventDefault();data.company={name:$('#companyName').value,email:$('#companyEmail').value,phone:$('#companyPhone').value,location:$('#companyLocation').value,banks:c.banks.map((b,i)=>({...b,account:$('#account'+i).value,payshap:$('#payshap'+i).value}))};$('#dialog').close();render();toast('Company details saved for new invoices.')}})}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){showDialog(`<h2>Back up your workspace</h2><p>Data is saved in this browser on this device. It is not synced online or sent to the company.</p><p class="note">Export includes your company details, price list, saved invoices and current draft. Keep the backup private. Restoring a backup replaces all current data.</p><div class="actions"><button id="exportBackup" class="primary">Export backup</button><button id="restoreBackup">Restore backup</button><input id="backupFile" type="file" accept=".json,application/json" hidden></div>`,()=>{$('#exportBackup').onclick=()=>{persist();download('ATDS-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')};$('#restoreBackup').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10e6)throw Error('File is larger than 10 MB');const restored=JSON.parse(await file.text());validateData(restored);if(!confirm('Replace all current data with this backup?'))return;data=restored;draft=data.draft||makeDraft();step=1;$('#dialog').close();render();toast('Backup restored.')}catch(error){toast('Cannot restore: '+error.message)}}})}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));$('#saved').onclick=savedInvoices;$('#business').onclick=editCompany;$('#backup').onclick=backup;$('#newOrder').onclick=()=>{if(draft.items.length&&!confirm('Start a new invoice? Your working draft will be replaced; saved invoices remain available.'))return;draft=makeDraft();loadedSnapshot=false;go(1)};
render();
</script></body></html>
